version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: parcels_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql+aiomysql://user:password@db/parcels_db
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    build: .
    command: celery -A app.tasks.worker worker --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql+aiomysql://user:password@db/parcels_db
      - REDIS_URL=redis://redis:6379/0

  celery_beat:
    build: .
    command: celery -A app.tasks.worker beat --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=mysql+aiomysql://user:password@db/parcels_db
      - REDIS_URL=redis://redis:6379/0

volumes:
  db_data:
  redis_data: 